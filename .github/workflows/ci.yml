name: CareerSathi CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Security & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      - name: Verify Backend Code Syntax
        run: cd backend && node --check server.js db.js middleware/*.js models/*.js routes/*.js
      - name: Run Backend Vitest Suite
        run: cd backend && JWT_SECRET=ci_test_secret_key npm test

  frontend-build:
    name: Frontend TypeCheck & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install Frontend Dependencies
        run: cd frontend-v2 && npm ci
      - name: Build Frontend SPA
        run: cd frontend-v2 && npm run build
