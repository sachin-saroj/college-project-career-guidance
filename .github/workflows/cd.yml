name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: careersathi/backend:latest,careersathi/backend:${{ github.sha }}
          
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: careersathi/frontend:latest,careersathi/frontend:${{ github.sha }}

      # Note: Real deployment would involve SSHing into the VM or updating a Kubernetes deployment here
      - name: Trigger Deployment
        run: |
          echo "Triggering deployment via SSH/Webhook..."
          # ssh user@host "cd /app && docker-compose pull && docker-compose up -d"
