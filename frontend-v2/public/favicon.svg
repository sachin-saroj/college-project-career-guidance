<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="csGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d42" />
      <stop offset="50%" stop-color="#003c33" />
      <stop offset="100%" stop-color="#01241f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00a4b4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#csGradient)" stroke="#00a4b4" stroke-width="2" />

  <!-- Inner Ambient Ring -->
  <circle cx="32" cy="32" r="26" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Graduation Cap / Career Compass Star Motif -->
  <g filter="url(#shadow)" transform="translate(32, 30)">
    <!-- Mortarboard Top -->
    <polygon points="0,-13 18,-4 0,5 -18,-4" fill="#ffffff" />
    <!-- Mortarboard Underside / Depth -->
    <polygon points="0,5 18,-4 18,-1 0,8 -18,-1 -18,-4" fill="#d1d5db" />
    <!-- Cap Base / Skullcap -->
    <path d="M-10,3 C-10,10 10,10 10,3 Z" fill="url(#accentGrad)" />
    <!-- Tassel String and Bead -->
    <path d="M-14,-2 Q-17,4 -17,11" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="-17" cy="12" r="2" fill="#38bdf8" />
  </g>

  <!-- Subtle Career Sparkle Star -->
  <path d="M43,15 L44.5,19 L48.5,20.5 L44.5,22 L43,26 L41.5,22 L37.5,20.5 L41.5,19 Z" fill="#38bdf8" />
</svg>