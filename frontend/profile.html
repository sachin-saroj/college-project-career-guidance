<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSathi - Student Profile</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">CareerSathi</a>
      <div class="d-flex">
        <span class="navbar-text me-3" id="nav-user-name"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      <div class="col-md-8 mx-auto">
        
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white">
            <h4 class="mb-0 text-primary">Student Profile</h4>
          </div>
          <div class="card-body">
            <p class="text-muted small mb-4">Complete your profile. Our AI uses this information to provide personalized career recommendations and scholarships.</p>
            
            <form id="profile-form">
              <!-- Education -->
              <div class="mb-3">
                <label class="form-label fw-bold">Highest Education Level</label>
                <select class="form-select" id="profile-education">
                  <option value="">Select...</option>
                  <option value="10th Pass">10th Pass</option>
                  <option value="12th Pass">12th Pass</option>
                  <option value="Undergraduate">Undergraduate (College)</option>
                  <option value="Postgraduate">Postgraduate</option>
                </select>
              </div>

              <!-- Skills -->
              <div class="mb-3">
                <label class="form-label fw-bold">Skills</label>
                <input type="text" class="form-control" id="profile-skills" placeholder="e.g. Communication, Basic Computers, Drawing">
                <div class="form-text">Separate skills with a comma.</div>
              </div>

              <!-- Interests -->
              <div class="mb-3">
                <label class="form-label fw-bold">Interests & Hobbies</label>
                <input type="text" class="form-control" id="profile-interests" placeholder="e.g. Helping people, Fixing electronics, Playing sports">
              </div>

              <!-- Career Goal -->
              <div class="mb-3">
                <label class="form-label fw-bold">Career Goal (If any)</label>
                <input type="text" class="form-control" id="profile-career-goal" placeholder="e.g. I want to become a software engineer">
              </div>

              <!-- Family Income -->
              <div class="mb-4">
                <label class="form-label fw-bold">Annual Family Income</label>
                <select class="form-select" id="profile-income">
                  <option value="">Select...</option>
                  <option value="Below 1 Lakh">Below ₹1,000,000</option>
                  <option value="1 Lakh to 3 Lakhs">₹1,000,000 to ₹3,000,000</option>
                  <option value="3 Lakhs to 5 Lakhs">₹3,000,000 to ₹5,000,000</option>
                  <option value="Above 5 Lakhs">Above ₹5,000,000</option>
                </select>
                <div class="form-text text-success"><small>This helps us find suitable scholarships for you.</small></div>
              </div>

              <div class="d-flex justify-content-between">
                <a href="dashboard.html" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" id="profile-submit-btn">Save Profile</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5 mb-3 text-muted small">
      &copy; 2026 CareerSathi. Built for students.
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
