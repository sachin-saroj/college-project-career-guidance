<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerSathi - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">CareerSathi</a>
    <div class="d-flex">
        <span class="navbar-text text-white me-3" id="userNameDisplay">Welcome!</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="row">
        <!-- AI Chat Section -->
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h5 class="mb-0 text-primary">AI Career Mentor (Gemini)</h5>
                </div>
                <div class="card-body d-flex flex-column">
                    <div id="chatBox" class="flex-grow-1 border rounded p-3 mb-3 bg-light" style="height: 400px; overflow-y: auto;">
                        <div class="mb-2 text-muted small text-center">Chat started</div>
                    </div>
                    <form id="chatForm" class="d-flex">
                        <input type="text" id="chatInput" class="form-control me-2" placeholder="Ask for career advice..." required>
                        <button type="submit" class="btn btn-primary" id="chatBtn">Send</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Resume Upload Section -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h5 class="mb-0 text-success">Resume Analyzer</h5>
                </div>
                <div class="card-body">
                    <p class="small text-muted">Upload your PDF resume. Our AI will parse it and provide suggestions.</p>
                    <form id="resumeForm">
                        <div class="mb-3">
                            <input class="form-control" type="file" id="resumeFile" accept="application/pdf" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="resumeBtn">Upload & Analyze</button>
                    </form>

                    <div id="resumeResults" class="mt-4 d-none">
                        <h6>Suggestions:</h6>
                        <div class="p-2 border rounded bg-light small" id="resumeSuggestions" style="white-space: pre-wrap; max-height: 250px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    // Auth Check
    if(!localStorage.getItem('token')) {
        window.location.href = 'index.html';
    } else {
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.name) {
            document.getElementById('userNameDisplay').textContent = `Welcome, ${user.name}!`;
        }
    }
</script>
</body>
</html>
