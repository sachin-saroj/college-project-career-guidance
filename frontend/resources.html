<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSathi - Resource Library</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">CareerSathi</a>
      <div class="d-flex">
        <span class="navbar-text me-3" id="nav-user-name"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row mb-4">
      <div class="col-12">
        <h2 class="fw-bold">Resource Library</h2>
        <p class="text-muted">Curated free courses, scholarships, and study materials for underprivileged students.</p>
      </div>
    </div>

    <!-- Container for dynamic resources -->
    <div class="row" id="resources-container">
      <div class="col-12 text-center text-muted py-5" id="resources-loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading curated resources...</p>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5 mb-3 text-muted small">
      &copy; 2026 CareerSathi. Built for students.
  </footer>

  <script src="js/app.js"></script>
  <script>
    // Call the function defined in app.js on page load
    document.addEventListener('DOMContentLoaded', fetchResources);
  </script>
</body>
</html>
