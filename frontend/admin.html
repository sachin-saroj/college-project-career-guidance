<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSathi - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand text-warning fw-bold" href="dashboard.html">CareerSathi Admin</a>
      <div class="d-flex">
        <span class="navbar-text me-3 text-white" id="nav-user-name"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4 text-dark fw-bold">Admin Dashboard</h2>

    <!-- Alert Container -->
    <div id="admin-alert-container"></div>

    <!-- Tabs Nav -->
    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab" aria-controls="users" aria-selected="true">Manage Users</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="resources-tab" data-bs-toggle="tab" data-bs-target="#resources" type="button" role="tab" aria-controls="resources" aria-selected="false">Manage Resources</button>
      </li>
    </ul>

    <!-- Tabs Content -->
    <div class="tab-content" id="adminTabsContent">
      
      <!-- Users Tab -->
      <div class="tab-pane fade show active" id="users" role="tabpanel" aria-labelledby="users-tab">
        <div class="card shadow-sm">
          <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Joined</th>
                </tr>
              </thead>
              <tbody id="admin-users-list">
                <!-- Users injected here -->
                <tr><td colspan="5" class="text-center py-4">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Resources Tab -->
      <div class="tab-pane fade" id="resources" role="tabpanel" aria-labelledby="resources-tab">
        <div class="row">
          
          <!-- Add Resource Form -->
          <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
              <div class="card-header bg-white"><h5 class="mb-0 text-success fw-bold">Add Resource</h5></div>
              <div class="card-body">
                <form id="admin-add-resource-form">
                  <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" id="res-title" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="res-desc" rows="2"></textarea>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">URL</label>
                    <input type="url" class="form-control" id="res-url" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" id="res-category" required>
                      <option value="Courses">Courses</option>
                      <option value="Scholarships">Scholarships</option>
                      <option value="Tech">Tech</option>
                      <option value="Study Materials">Study Materials</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Tags (comma-separated)</label>
                    <input type="text" class="form-control" id="res-tags" placeholder="Math, Free, Web Dev">
                  </div>
                  <button type="submit" class="btn btn-success w-100" id="res-submit-btn">Add Resource</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Existing Resources List -->
          <div class="col-md-8 mb-4">
            <div class="card shadow-sm h-100">
              <div class="card-header bg-white"><h5 class="mb-0 text-dark fw-bold">Existing Resources</h5></div>
              <div class="card-body p-0" style="max-height: 600px; overflow-y: auto;">
                <table class="table table-hover mb-0">
                  <thead class="table-light sticky-top">
                    <tr>
                      <th>Title</th>
                      <th>Category</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="admin-resources-list">
                    <!-- Resources injected here -->
                    <tr><td colspan="3" class="text-center py-4">Loading resources...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <footer class="text-center mt-5 mb-3 text-muted small">
      &copy; 2026 CareerSathi. Built for students.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initAdminPanel);
  </script>
</body>
</html>
