version: '3.8'

services:
  # Nginx Reverse Proxy & Frontend Serve
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - careersathi-net

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/careersathi
      - REDIS_URL=redis://redis:6379
      # Note: Inject other secrets (JWT, Gemini API key, Sentry) via CI/CD or .env
    depends_on:
      - mongo
      - redis
    networks:
      - careersathi-net

  # Redis for Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - careersathi-net

  # Local MongoDB for Dev/Testing (Use Atlas for real Production)
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - careersathi-net

volumes:
  mongo-data:
  redis-data:

networks:
  careersathi-net:
    driver: bridge
